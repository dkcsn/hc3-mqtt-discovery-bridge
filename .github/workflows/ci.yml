name: CI

on:
  push:
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install plua==1.3.16
      - run: plua tests/run_all.lua
      - run: PLUA_BIN="$(command -v plua)" scripts/package.sh
      - run: git diff --check
      - run: shasum -a 256 dist/HC3-MQTT-Discovery-Bridge-$(tr -d '[:space:]' < VERSION).fqa
